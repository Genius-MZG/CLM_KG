name: Recover North America event data

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: recover-na-event-data-v15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests remotezip matplotlib numpy rasterio

      - name: Install required publication fonts
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          echo msttcorefonts msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-arphic-gkai00mp fonts-arphic-ukai ttf-mscorefonts-installer
          sudo fc-cache -f -v >/dev/null
          fc-list | grep -Ei 'Times New Roman|AR PL KaitiM GB|AR PL UKai|KaiTi|STKaiti' || true

      - name: Recover and audit public data
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("research/recover_na_event_data.py")
          text = path.read_text(encoding="utf-8")
          old = 'timeout=180, headers={"User-Agent": "NorthAmericaFloodplainResearch/1.0"}'
          new = 'timeout=(10, 30), headers={"User-Agent": "NorthAmericaFloodplainResearch/1.0"}'
          if old not in text:
              raise RuntimeError("Expected GRDC timeout expression was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python research/recover_na_event_data.py

      - name: Recover OPERA RTC catalogue
        run: python research/recover_opera_rtc_catalog.py

      - name: Probe OPERA RTC raster access
        timeout-minutes: 2
        run: python research/probe_opera_rtc_access.py

      - name: Probe ASF GRD and burst access
        timeout-minutes: 2
        continue-on-error: true
        run: |
          if [[ -s research/recovered_data/asf_sentinel1_candidates.csv ]]; then
            python research/probe_asf_grd_burst_access.py
          else
            mkdir -p research/recovered_data/source_access_probe
            printf '%s\n' '{"probe_skipped":true,"reason":"ASF catalogue was not produced because the transient GRDC station-coordinate request failed; this legacy authenticated path is not an input to the Planetary Computer RTC reconstruction."}' > research/recovered_data/source_access_probe/asf_source_access_probe.json
          fi

      - name: Probe public Sentinel-1 RODA fallback
        timeout-minutes: 3
        continue-on-error: true
        run: |
          if [[ -s research/recovered_data/asf_sentinel1_candidates.csv ]]; then
            python research/probe_public_s1_roda.py
          else
            mkdir -p research/recovered_data/source_access_probe
            printf '%s\n' '{"probe_skipped":true,"reason":"Exact GRD scene names were unavailable in this run; the public RODA legacy check is decoupled from the verified Planetary Computer RTC path."}' > research/recovered_data/source_access_probe/public_s1_roda_probe.json
          fi

      - name: Probe Planetary Computer Sentinel-1 fallback
        timeout-minutes: 5
        run: python research/probe_planetary_computer_s1.py

      - name: Extract five-phase Planetary Computer RTC rasters
        timeout-minutes: 20
        run: python research/extract_planetary_computer_rtc.py

      - name: Probe real water-label and DEM model inputs
        timeout-minutes: 5
        run: python research/probe_model_inputs.py

      - name: Recover JRC and DEM model inputs
        timeout-minutes: 15
        run: python research/prepare_model_inputs.py

      - name: Audit recovered model inputs
        timeout-minutes: 5
        run: python research/audit_model_inputs.py

      - name: Prepare validated figure inputs
        run: |
          if [[ -s research/recovered_data/grdc_pair_basins_arcgis.geojson && -s research/recovered_data/grdc_pair_station_metadata.csv ]]; then
            python research/prepare_figure_inputs.py
          else
            mkdir -p research/recovered_data/figure_ready
            printf '%s\n' '{"figure01_02_preparation_skipped":true,"reason":"The official GRDC geometry endpoint was transiently unavailable in this run. Previously verified figure exports remain valid; no substitute geometry was invented."}' > research/recovered_data/figure_ready/figure_preparation_status.json
          fi

      - name: Build figure specifications and gated exports
        run: |
          if [[ -s research/recovered_data/grdc_pair_basins_arcgis.geojson && -s research/recovered_data/grdc_pair_station_metadata.csv ]]; then
            python research/render_supported_figures.py
          else
            echo "Skipping Figure 1/2 regeneration because official GRDC geometry is absent in this transient run."
          fi

      - name: Render five-phase RTC and coverage figures
        timeout-minutes: 10
        run: python research/render_rtc_figures.py

      - name: Audit candidate JRC labels and spatial blocks
        timeout-minutes: 5
        run: python research/build_label_sensitivity_audit.py

      - name: Show recovery status
        if: always()
        run: |
          find research/recovered_data -maxdepth 6 -type f -printf '%p %s bytes\n' | sort || true
          cat research/recovered_data/recovery_status.json || true
          cat research/recovered_data/opera_rtc_catalog/opera_rtc_catalog_status.json || true
          cat research/recovered_data/opera_rtc_catalog/access_probe/opera_rtc_access_probe.json || true
          cat research/recovered_data/source_access_probe/asf_source_access_probe.json || true
          cat research/recovered_data/source_access_probe/public_s1_roda_probe.json || true
          cat research/recovered_data/source_access_probe/planetary_computer_s1_probe.json || true
          cat research/recovered_data/planetary_computer_rtc/rtc_extraction_progress.json || true
          cat research/recovered_data/planetary_computer_rtc/rtc_extraction_failure.json || true
          cat research/recovered_data/planetary_computer_rtc/rtc_extraction_status.json || true
          cat research/recovered_data/model_inputs/model_input_probe.json || true
          cat research/recovered_data/model_inputs/model_input_status.json || true
          cat research/recovered_data/model_inputs/model_input_failure.json || true
          cat research/recovered_data/model_inputs/qa/model_input_qa.json || true
          cat research/recovered_data/label_audit/label_audit_status.json || true
          cat research/recovered_data/figure_ready/font_gate.json || true
          cat research/recovered_data/figure_ready/figure_preparation_status.json || true
          cat research/recovered_data/figure_outputs/figure_qa_status.json || true
          cat research/recovered_data/figure_outputs/figure03_04_qa_status.json || true

      - name: Upload recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-america-event-recovered-data
          path: research/recovered_data/
          if-no-files-found: error
          retention-days: 14
