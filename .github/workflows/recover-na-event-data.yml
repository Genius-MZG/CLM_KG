name: Recover North America event data

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests remotezip

      - name: Recover and audit public data
        run: python research/recover_na_event_data.py

      - name: Show recovery status
        if: always()
        run: |
          find research/recovered_data -maxdepth 3 -type f -printf '%p %s bytes\n' | sort || true
          cat research/recovered_data/recovery_status.json || true

      - name: Upload recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-america-event-recovered-data
          path: research/recovered_data/
          if-no-files-found: error
          retention-days: 14
