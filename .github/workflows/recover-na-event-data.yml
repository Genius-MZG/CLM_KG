name: Recover North America event data

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: recover-na-event-data-v8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests remotezip matplotlib numpy rasterio

      - name: Install required publication fonts
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          echo msttcorefonts msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-arphic-gkai00mp fonts-arphic-ukai ttf-mscorefonts-installer
          sudo fc-cache -f -v >/dev/null
          fc-list | grep -Ei 'Times New Roman|AR PL KaitiM GB|AR PL UKai|KaiTi|STKaiti' || true

      - name: Recover and audit public data
        run: python research/recover_na_event_data.py

      - name: Recover OPERA RTC catalogue
        run: python research/recover_opera_rtc_catalog.py

      - name: Probe OPERA RTC raster access
        timeout-minutes: 2
        run: python research/probe_opera_rtc_access.py

      - name: Probe ASF GRD and burst access
        timeout-minutes: 3
        run: python research/probe_asf_grd_burst_access.py

      - name: Probe public Sentinel-1 RODA fallback
        timeout-minutes: 5
        run: python research/probe_public_s1_roda.py

      - name: Probe Planetary Computer Sentinel-1 fallback
        timeout-minutes: 5
        run: python research/probe_planetary_computer_s1.py

      - name: Extract five-phase Planetary Computer RTC rasters
        timeout-minutes: 12
        run: python research/extract_planetary_computer_rtc.py

      - name: Prepare validated figure inputs
        run: python research/prepare_figure_inputs.py

      - name: Build figure specifications and gated exports
        run: python research/render_supported_figures.py

      - name: Show recovery status
        if: always()
        run: |
          find research/recovered_data -maxdepth 6 -type f -printf '%p %s bytes\n' | sort || true
          cat research/recovered_data/recovery_status.json || true
          cat research/recovered_data/opera_rtc_catalog/opera_rtc_catalog_status.json || true
          cat research/recovered_data/opera_rtc_catalog/access_probe/opera_rtc_access_probe.json || true
          cat research/recovered_data/source_access_probe/asf_source_access_probe.json || true
          cat research/recovered_data/source_access_probe/public_s1_roda_probe.json || true
          cat research/recovered_data/source_access_probe/planetary_computer_s1_probe.json || true
          cat research/recovered_data/planetary_computer_rtc/rtc_extraction_status.json || true
          cat research/recovered_data/figure_ready/font_gate.json || true
          cat research/recovered_data/figure_ready/figure_preparation_status.json || true
          cat research/recovered_data/figure_outputs/figure_qa_status.json || true

      - name: Upload recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-america-event-recovered-data
          path: research/recovered_data/
          if-no-files-found: error
          retention-days: 14
